<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davi Rocha | Portfólio</title>
    
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fonte padrão do sistema, pode mudar */
        }

        body {
            /* Removemos o background-color azul sólido para o vídeo aparecer */
            background-color: transparent; 
            color: #ffffff; /* Texto branco */
            height: 100vh;
            overflow-x: hidden; /* Evita rolagem lateral */
        }

        /* --- CONFIGURAÇÃO DO VÍDEO DE FUNDO --- */
        #myVideo {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2; /* Fica atrás de tudo */
            object-fit: cover; /* Cobre a tela sem distorcer */
        }

        /* Máscara escura sobre o vídeo para o texto ficar legível */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 26, 46, 0.6); /* Azul escuro com 60% de opacidade */
            z-index: -1; /* Fica em cima do vídeo, mas atrás do conteúdo */
        }

        /* --- SEU LAYOUT ORIGINAL --- */
        
        /* Barra de navegação superior */
        .navbar {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            letter-spacing: 2px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .brand-box {
            background-color: #ffffff;
            color: #121a2e; /* Cor escura para o texto dentro da caixa branca */
            padding: 5px 10px;
            margin-right: 10px;
            font-weight: 800;
        }

        /* Conteúdo principal centralizado verticalmente */
        .hero-section {
            height: 80vh; /* Ocupa 80% da altura da tela */
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10%; /* Alinhado à esquerda como na sua imagem */
            padding-right: 10%;
        }

        h1 {
            font-size: 4rem; /* Tamanho grande para o nome */
            font-weight: 700;
            margin-bottom: 20px;
        }

        .divider {
            width: 100%;
            height: 2px;
            background-color: #ffffff;
            margin-bottom: 30px;
        }

        .subtitle-row {
            display: flex;
            justify-content: space-between; /* Espalha o texto e o botão */
            align-items: flex-start;
            flex-wrap: wrap; /* Quebra linha em telas menores */
            gap: 20px;
        }

        .roles {
            font-size: 0.9rem;
            line-height: 1.6;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
            max-width: 600px;
        }

        /* Botão "Ver Editorias" */
        .btn-outline {
            display: inline-flex;
            align-items: center;
            padding: 12px 30px;
            border: 2px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            background-color: #ffffff;
            color: #121a2e;
        }

        .arrow {
            margin-left: 10px;
            font-size: 1.2rem;
        }

    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="myVideo">
        <source src="background.mp4" type="video/mp4">
        Seu navegador não suporta vídeos em HTML5.
    </video>

    <div class="video-overlay"></div>

    <nav class="navbar">
        <div class="brand-box">DAVI ROCHA</div>
        <div>PORTFOLIO</div>
    </nav>

    <main class="hero-section">
        <h1>Davi Rocha</h1>
        
        <div class="divider"></div>

        <div class="subtitle-row">
            <div class="roles">
                JORNALISTA | VIDEOMAKER | GEEK & TECH | NITERÓI - RJ<br>
                TRANSFORMANDO IDEIAS EM NARRATIVAS VISUAIS.
            </div>

            <a href="#" class="btn-outline">
                Ver Editorias <span class="arrow">→</span>
            </a>
        </div>
    </main>

</body>
</html>
